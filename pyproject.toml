[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "morningbar"
version = "0.1.0"
description = "A private local morning news briefing for Wayland desktops"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "feedparser>=6.0.11",
  "google-genai>=2.3.0",
  "httpx[http2]>=0.28.1",
  "icalendar>=6.1",
  "pydantic>=2.10",
  "rapidfuzz>=3.11",
  "trafilatura>=2.0",
  "typer>=0.15",
]

[project.scripts]
morningbar = "morningbar.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
]

[tool.hatch.build.targets.wheel]
packages = ["src/morningbar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
