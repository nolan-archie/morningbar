# Approved editable interests and source list. Installed at
# ~/.config/morningbar/interests.toml; this repository copy is its baseline.

[settings]
lookback_hours = 36
shown_cooldown_hours = 72
max_candidates = 150
max_feed_items = 50
max_body_bytes = 4000000
request_interval_seconds = 1.0
local_timezone = "Africa/Johannesburg"
morning_start = "05:00"
morning_end = "11:00"
late_grace_minutes = 0
trigger_debounce_seconds = 60
network_wait_seconds = 240

# App-side safety caps only; Google publishes per-project live limits in AI Studio.
[gemini]
enabled = true
primary_model = "gemini-3.5-flash-lite"
fallback_model = "gemini-3.8-flash"
batch_size = 50
max_stories = 15
max_per_category = 3
max_requests_per_run = 6
max_requests_per_day = 12
max_tokens_per_minute = 30000
max_tokens_per_day = 40000
max_output_tokens = 3500
max_retries = 2
retry_base_seconds = 1.0
minimum_request_interval_seconds = 4.0

[[topics]]
id = "nvidia_tech"
label = "Nvidia & tech"
weight = 5
keywords = ["NVIDIA", "GeForce", "CUDA", "GPU", "AI hardware", "Linux driver", "earnings", "AI industry"]
manual_priority = false
[topics.keyword_boosts]
"NVIDIA" = 1.5
"Linux driver" = 2.0
"CUDA" = 1.0

[[topics]]
id = "ai_research"
label = "AI research & efficient models"
weight = 5
keywords = ["quantization", "KV cache", "sparse attention", "linear attention", "speculative decoding", "low memory inference", "associative memory", "optimal forgetting", "llama.cpp"]
manual_priority = false
[topics.keyword_boosts]
"KV cache" = 2.0
"quantization" = 1.5
"associative memory" = 2.0
"optimal forgetting" = 2.0

[[topics]]
id = "math_quant"
label = "Math & quant"
weight = 3
keywords = ["stochastic calculus", "Ito", "Black-Scholes", "volatility", "regime detection", "backtesting", "q-fin", "mathematical probability"]
manual_priority = false
[topics.keyword_boosts]
"Black-Scholes" = 1.5
"regime detection" = 2.0

[[topics]]
id = "android_kernels"
label = "Android & kernels"
weight = 5
keywords = ["KernelSU-Next", "SukiSU-Ultra", "SuSFS", "pershoot", "Tricky Store", "Play Integrity", "key attestation", "ReZygisk", "phh GSI", "SM-A165F", "Galaxy A16", "One UI", "security patch", "Android 16", "Android 17", "Linux 6.12"]
manual_priority = false
[topics.keyword_boosts]
"SM-A165F" = 2.0
"Galaxy A16" = 1.5
"Play Integrity" = 1.5

[[topics]]
id = "linux_gaming"
label = "Linux & gaming compatibility"
weight = 5
keywords = ["Arch Linux", "manual intervention", "Hyprland", "Niri", "Quickshell", "end-4", "Mesa", "Wine", "Proton", "GE-Proton", "Heroic Games Launcher", "Phoronix", "LWN", "GamingOnLinux", "libfprint", "python-validity", "anti-cheat"]
manual_priority = true
[topics.keyword_boosts]
"manual intervention" = 5.0
"manual intervention required" = 5.0
"Arch Linux news" = 3.0

[[topics]]
id = "games"
label = "Games"
weight = 4
keywords = ["Genshin Impact", "EU server", "livestream code", "banner", "Zenless Zone Zero", "anti-cheat", "JShoe", "Zy0x"]
manual_priority = false
[topics.keyword_boosts]
"livestream code" = 2.0
"banner" = 1.0

[[topics]]
id = "anime"
label = "Anime"
weight = 3
keywords = ["anime", "airing schedule", "season premiere", "season finale"]
manual_priority = false
watchlist = []

[[topics]]
id = "markets_news"
label = "Markets news"
weight = 3
keywords = ["gold", "XAU/USD", "EUR/USD", "Federal Reserve", "ECB", "CPI", "NFP", "Treasury yields", "DXY", "FundedNext rule"]
manual_priority = false
news_only = true
[topics.keyword_boosts]
"CPI" = 1.0
"NFP" = 1.0
"FundedNext rule" = 2.0

[[topics]]
id = "study_scholarships"
label = "Study & scholarships"
weight = 5
keywords = ["Cambridge International", "9709", "9702", "9618", "9231", "syllabus", "exam timetable", "entry deadline", "CSC", "Tsinghua", "GKS", "KAIST", "HKU", "MEXT", "Poland scholarship", "Indonesia scholarship", "Romania scholarship", "Erasmus Mundus"]
manual_priority = false

